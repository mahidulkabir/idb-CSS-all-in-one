<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box example</title>
    <style>
        .parent{
            display: flex;
            gap: 5px;
        }
        .size{
            width: 150px;
            height: 150px;
            text-align: center;
        }
        .div1{
            BACKGROUND-CO: rgb(122, 42, 226);
            
            
        }
        .div2{
            background-color: rgb(154, 100, 224);
            border-bottom-left-radius: 50%;
        }
        .div3{
            background-color: rgb(51, 102, 170);
            border-top-left-radius: 50%;
        }
        .div4{
            background-color: rgb(80, 204, 23);
            border-radius: 20px;
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="div1 size">one</div>
    <div class="div2 size">two</div>
    <div class="div3 size">three</div>
    <div class="div4 size">four</div>
    </div>
    
</body>
</html>
