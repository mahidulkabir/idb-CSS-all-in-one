<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html Table</title>
    <style>
        body{
            background-color: bisque;
        }
        td,th,table{
            border: 1px solid;
            border-collapse: collapse;
        }
        table{
            margin: 50px auto;
            background-color: aliceblue;
        }
        td,th{
            padding: 20px 25px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Name</th>
            <th rowspan="3">Result</th>
            <th>class</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Tanvir</td>
            <td>X</td>
            <td>80</td>
        </tr>
        <tr>
            <td>Ayan</td>
            <td>II</td>
            <td>90</td>
        </tr>
    </table>
</body>
</html>
