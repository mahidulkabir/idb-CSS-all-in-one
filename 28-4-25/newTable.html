<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>new table</title>
    <style>
      table,
      td {
        border-collapse: collapse;
        border: 1px solid black;
        width: 100% ;
    }
    td {
        
        width: 150px;
        border-spacing: 10px;
        
      }
      tr{
        background-color: blanchedalmond;
      }
      tr:hover{
        background-color: aquamarine;
        color: blue;
        
      }
      .right{
        text-align: right;
      }
      .center{
        text-align: center;
      }
      .extra{
        width: 400px;
        text-align:center;
      }
    </style>
  </head>

</html>
