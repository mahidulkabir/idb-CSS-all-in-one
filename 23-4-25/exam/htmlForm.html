<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        body{
            background-color: antiquewhite;
        }
        fieldset{
            width: 30%;
            margin: 50px auto;
            border-radius: 8px;
            background-color: aliceblue;
        }
        table{
            margin: auto;
        }
    </style>

</head>
<body>
    <div>
        <fieldset>
            <form action="">
                <table>
                    <tr>
                        <td>ID: </td>
                        <td><input type="text" name="" id="" placeholder="Your ID"></td>
                    </tr>
                    <tr>
                        <td>Name:</td>
                        <td> <textarea name="" id="" placeholder="Your Name"></textarea></td>
                    </tr>
                    <tr>
                        <td>Your Round: </td>
                        <td>
                            <select name="" id="">
                                <option > select</option>
                                <option > 64</option>
                                <option > 65</option>
                                <option > 66</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td> Gender: </td>
                        <td>
                            <input type="radio" name="gender" id=""> Male
                            <input type="radio" name="gender" id=""> Female
                            <input type="radio" name="gender" id=""> Others
                        </td>
                    </tr>
                    <tr>
                        <td> Education:</td>
                        <td> <input type="checkbox" name="" id=""> SSC
                         <input type="checkbox" name="" id=""> HSC
                        <input type="checkbox" name="" id=""> BSC</td>
                    </tr>
                    <tr>
                        <td> <input type="submit" value="Submit"></td>
                        <td> <input type="reset" value="Reset"></td>
                    </tr>
                </table>
            </form>
        </fieldset>
    </div>
</body>
</html>
