<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFrame</title>
<style>
    body{
        margin:10px 50px ;
    }
    ul li{
        list-style: none;
        padding: 10px;
    }
    ul li a{
        text-decoration: none;
        color: inherit;
    }
    .left{
        float: left;
        width: 18%;
        border:1px solid black;
        height: 500px;
        background-color: antiquewhite;
    }
    iframe{
        width: 78%;
        height: 500px;
    }
</style>

</head>
<body>
    <div class="left">
        <ul>
            <li> <button> <a href="./htmlTable.html" target="frame">html Table</a></button></li>
            <li> <button> <a href="./htmlForm.html" target="frame">html Form</a></button></li>
          
        </ul>
    </div>
    <div class="right">
        <iframe src="./htmlTable.html" frameborder="1" name="frame"></iframe>
    </div>
</body>
</html>
